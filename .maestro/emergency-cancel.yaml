# Authored, unexecuted. Requires an installed native test build identified by APP_ID.
# This flow stops at Cancel. It never opens the phone dialer or places a call.
appId: ${APP_ID}
name: Deliberate emergency action cancellation
---
- launchApp
- tapOn: "(?i)Home"
- scrollUntilVisible:
    element:
      text: "Emergency\\? Call 911"
    direction: UP
- tapOn: "Emergency\\? Call 911"
- assertVisible: "Call 911\\?"
- tapOn: "(?i)Cancel"
- assertNotVisible: "Call 911\\?"
