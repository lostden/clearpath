# Authored, unexecuted. APP_ID must identify a disposable installed native test build.
# Live NWS content varies; this tests explicit point selection without GPS permission.
appId: ${APP_ID}
name: Manual point selection
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- assertVisible: "SET LOCATION"
- assertNotVisible: "SIMULATED DEMO"
- tapOn:
    id: "location-picker-button"
- assertVisible: 'SELECT POINT\.'
- scrollUntilVisible:
    element:
      id: "location-manual-latitude"
    direction: DOWN
- tapOn:
    id: "location-manual-latitude"
- inputText: "30.0474"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "location-manual-longitude"
    direction: DOWN
- tapOn:
    id: "location-manual-longitude"
- inputText: "-99.1403"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "location-manual-save"
    direction: DOWN
- tapOn:
    id: "location-manual-save"
    enabled: true
- assertNotVisible: 'SELECT POINT\.'
- assertVisible: '30\.0474, -99\.1403'
- assertVisible: "Manual selection · CHANGE"
- assertNotVisible: "SIMULATED DEMO"
