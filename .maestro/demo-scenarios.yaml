# Authored, unexecuted. APP_ID must identify a disposable installed native test build.
# Demo entry is explicit. Each local fixture remains visibly simulated.
appId: ${APP_ID}
name: Simulation source separation
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- assertVisible: "CLEARPATH"
- assertVisible: "SET LOCATION"
- assertNotVisible: "SIMULATED DEMO"
- scrollUntilVisible:
    element: "Explore simulated demo"
    direction: DOWN
- tapOn: "Explore simulated demo"
- assertVisible: "SIMULATED DEMO"
- scrollUntilVisible:
    element: "Flash Flood Warning"
    direction: UP
- assertVisible: "SIMULATED DEMO"
- scrollUntilVisible:
    element:
      id: "demo-tornado"
    direction: DOWN
- tapOn:
    id: "demo-tornado"
- scrollUntilVisible:
    element:
      text: "Tornado Warning"
    direction: UP
- assertVisible: "SIMULATED DEMO"
- scrollUntilVisible:
    element:
      id: "demo-normal"
    direction: DOWN
- tapOn:
    id: "demo-normal"
- scrollUntilVisible:
    element:
      text: '(?i)No active alerts in this simulated scenario\.'
    direction: UP
- assertVisible: "SIMULATED DEMO"
- scrollUntilVisible:
    element:
      id: "demo-offline"
    direction: DOWN
- tapOn:
    id: "demo-offline"
- scrollUntilVisible:
    element:
      text: "(?i)Simulated internet outage"
    direction: UP
- assertVisible: "SIMULATED DEMO"
- assertNotVisible: "LIVE · OFFICIAL NWS"
- scrollUntilVisible:
    element:
      id: "mode-live"
    direction: DOWN
- tapOn:
    id: "mode-live"
- assertNotVisible: "SIMULATED DEMO"
- scrollUntilVisible:
    element: "SET LOCATION"
    direction: UP
- assertVisible: "POINT ALERTS / UNVERIFIED"
